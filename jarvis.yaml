substitutions:
  # Main prefix for all entities
  name: "Fully Jarvis"
  # Name of your node
  node_name: "fully-jarvis"

esphome:
  name: $node_name
  friendly_name: $name

esp8266:
  board: d1_mini

external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

# Enable logging. The handset shares the hardware UART, so the logger must not
# use it.
logger:
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_update_password

uart:
  # Hardware UART0 to the handset.
  - id: handset_uart
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 9600
  # Software UART to the control box.
  - id: controlbox_uart
    tx_pin: GPIO4
    rx_pin: GPIO5
    baud_rate: 9600

jarvis_desk:
  id: desk
  handset_uart_id: handset_uart
  controlbox_uart_id: controlbox_uart

# Diagnostics. These answer the two questions the handset lockup left open:
# whether the heap degrades over days, and whether anything blocks the main
# loop long enough to trip the hardware watchdog.
debug:
  update_interval: 60s

binary_sensor:
  - platform: status
    name: "Status"

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    fragmentation:
      name: "Heap Fragmentation"
    loop_time:
      name: "Loop Time (max)"
  - platform: jarvis_desk
    preset_1:
      name: "Preset 1 Position"
    preset_2:
      name: "Preset 2 Position"
    preset_3:
      name: "Preset 3 Position"
    preset_4:
      name: "Preset 4 Position"
    user_limit_min:
      name: "User Limit (minimum)"
    user_limit_max:
      name: "User Limit (maximum)"
    sys_limit_min:
      name: "System Limit (minimum)"
    sys_limit_max:
      name: "System Limit (maximum)"

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
  - platform: jarvis_desk
    user_limit_set:
      name: "User Limit"

select:
  - platform: jarvis_desk
    units:
      name: "Units"
    touch_mode:
      name: "Touch Mode"
    kill_mode:
      name: "Kill Mode"
    sensitivity:
      name: "Sensitivity"

number:
  - platform: jarvis_desk
    height:
      name: "Height"
    offset:
      name: "Offset"

button:
  - platform: jarvis_desk
    go_preset_1:
      name: "Go to Preset 1"
    go_preset_2:
      name: "Go to Preset 2"
    go_preset_3:
      name: "Go to Preset 3"
    go_preset_4:
      name: "Go to Preset 4"
    set_preset_1:
      name: "Set Preset 1"
    set_preset_2:
      name: "Set Preset 2"
    set_preset_3:
      name: "Set Preset 3"
    set_preset_4:
      name: "Set Preset 4"
    set_max_height:
      name: "Set Maximum Height"
    set_min_height:
      name: "Set Minimum Height"
    clear_max_height:
      name: "Clear Maximum Height"
    clear_min_height:
      name: "Clear Minimum Height"
